# The CRM against the framework's main branch, every night and when the framework
# asks (repository_dispatch, type `framework-changed`). A failure here means a
# change on the framework's main branch breaks an app that lives outside it.
name: Framework main

on:
  schedule:
    - cron: "43 2 * * *"
  repository_dispatch:
    types: [framework-changed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-main
  cancel-in-progress: true

jobs:
  against-main:
    name: CRM on the framework's main branch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The CRM and the framework are checked out side by side. With the framework
    # inside the CRM's folder, Cargo would take its crates for members of the
    # CRM's workspace, whose dependency table they cannot inherit from.
    defaults:
      run:
        working-directory: crm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: crm
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NavreeHQ/navree
          ref: main
          path: navree
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crm
          cache-on-failure: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: crm/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Point the builds at the framework checkout
        run: scripts/use-framework.sh "$GITHUB_WORKSPACE/navree"
      - name: API tests
        run: cargo test --workspace
      - name: Next.js front end
        run: |
          pnpm --dir web install --no-frozen-lockfile
          pnpm --dir web typecheck
          pnpm --dir web test
      - name: Nuxt front end
        run: |
          pnpm --dir nuxt install --no-frozen-lockfile
          pnpm --dir nuxt typecheck
          pnpm --dir nuxt test
